[project]
name = "velora"
version = "0.3.0"
description = "A Liquid Reinforcement Learning (RL) framework."
authors = [{ name = "Ryan Partridge", email = "codemonkey37@proton.me" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<4.0"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "flax==0.12.6",
    "gymnasium>=1.2.3",
    "jax==0.9.2",
    "orbax-checkpoint==0.11.26",
    "optax==0.2.8",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.4",
    "chex>=0.1.91",
]

[project.optional-dependencies]
discrete = ["ale-py>=0.11.2", "gymnasium[other]>=1.2.3"]
continuous = ["mujoco>=3.0", "gymnasium[box2d]>=1.2.3"]
dmc = ["shimmy[dm_control]>=2.0"]
all = ["velora[discrete]", "velora[continuous]", "velora[dmc]"]

[project.urls]
repository = "https://github.com/Achronus/velora"
documentation = "https://velora.achronus.dev"
issues = "https://github.com/Achronus/velora/issues"

[dependency-groups]
ci = ["git-cliff==2.12.0"]
docs = [
    "mike==2.1.4",
    "mkdocs>=1.6.1",
    "mkdocs-material==9.7.6",
    "mkdocstrings-python==2.0.3",
]
notebook = ["notebook==7.5.5", "ipywidgets>=8.1.8"]
all = ["velora[discrete]", "velora[continuous]", "velora[dmc]"]

[tool.setuptools.packages.find]
include = ["velora*"]
