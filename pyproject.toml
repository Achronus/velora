[project]
name = "velora"
version = "0.3.0"
description = "A Liquid Reinforcement Learning (RL) framework."
authors = [{ name = "Ryan Partridge", email = "codemonkey37@proton.me" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<4.0"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "flax==0.12.7",
    "gymnasium[box2d,mujoco]>=1.3.0",
    "orbax-checkpoint==0.11.39",
    "optax==0.2.8",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.5",
    "envrax>=0.1.9",
]

[project.urls]
repository = "https://github.com/Achronus/velora"
documentation = "https://velora.achronus.dev"
issues = "https://github.com/Achronus/velora/issues"

[dependency-groups]
docs = ["mkdocs>=1.6.1", "mkdocs-material==9.7.6", "mkdocstrings-python==2.0.3"]

[tool.setuptools.packages.find]
include = ["velora*"]
