[project]
name = "velora"
version = "0.3.0"
description = "A Liquid Reinforcement Learning (RL) framework."
authors = [{ name = "Ryan Partridge", email = "codemonkey37@proton.me" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13,<4.0"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "flax==0.12.7",
    "orbax-checkpoint==0.11.39",
    "optax==0.2.8",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.5",
    "mujorax==0.1.3",
]

[project.urls]
repository = "https://github.com/Achronus/velora"
documentation = "https://velora.achronus.dev"
issues = "https://github.com/Achronus/velora/issues"

[dependency-groups]
docs = ["mkdocs-material==9.7.6", "mkdocstrings-python==2.0.3"]
test = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "pillow>=12.2.0",
    "pytest-cov>=7.1.0",
]
notebook = ["notebook==7.5.6", "ipywidgets>=8.1.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["velora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv"]
addopts = "-n auto"
