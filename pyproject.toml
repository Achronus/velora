[project]
name = "velora"
version = "0.3.0"
description = "A Liquid Reinforcement Learning (RL) framework."
authors = [{ name = "Ryan Partridge", email = "codemonkey37@proton.me" }]
license = "MIT License"
readme = "README.md"
requires-python = ">=3.13,<4.0"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ale-py>=0.11.2",
    "distrax>=0.1.7",
    "flax>=0.12.0",
    "gymnasium[classic-control,other]>=1.2.3",
    "jax>=0.8.0",
    "jax-ai-stack",
    "optax>=0.2.6",
    "rlax>=0.1.8",
    "safetensors>=0.7.0",
    "tensorboardx>=2.6.4",
]

[project.urls]
repository = "https://github.com/Achronus/velora"
documentation = "https://velora.achronus.dev"
issues = "https://github.com/Achronus/velora/issues"

[dependency-groups]
ci = ["git-cliff>=2.11.0"]
docs = [
    "mike>=2.1.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings-python>=2.0.1",
]
notebook = ["notebook>=7.5.1", "ipywidgets>=8.1.8"]
